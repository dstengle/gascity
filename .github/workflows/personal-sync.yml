name: Sync personal/main from upstream

# Reads .github/personal-patches.toml from THIS branch (personal-config)
# and rebuilds personal/main from upstream/main + the manifest's patches.
# Each [[patches]] entry becomes a single merge commit on personal/main.
#
# personal-config holds the manifest + this workflow + PERSONAL_BUILD.md.
# personal/main is a pure build output — never hand-edited, force-pushed
# by this workflow.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would happen but don't push"
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'  # daily at 6am UTC
  push:
    branches: [personal-config]
    paths:
      - '.github/personal-patches.toml'
      - '.github/workflows/personal-sync.yml'

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild personal/main from manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-config
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git and fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/gastownhall/gascity.git
          git fetch upstream main --quiet

      - name: Rebuild personal/main from manifest
        run: |
          set -euo pipefail

          MANIFEST=.github/personal-patches.toml
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::manifest not found: $MANIFEST"
            exit 1
          fi

          # Cache the manifest before the staging checkout — checkout points
          # the working tree at upstream/main, which does not have the file.
          MANIFEST_CACHE=$(mktemp)
          cp "$MANIFEST" "$MANIFEST_CACHE"

          # Stage the rebuilt branch separately so we don't disturb
          # personal/main if anything below fails.
          git checkout -B personal-main-staging upstream/main

          python3 - "$MANIFEST_CACHE" <<'PY' > /tmp/patches.tsv
          import sys, tomllib
          with open(sys.argv[1], 'rb') as f:
              data = tomllib.load(f)
          for p in data.get('patches', []):
              name = p['name']
              branch = p['branch']
              desc = p.get('description', '')
              upstream_pr = p.get('upstream_pr', '')
              print(f"{name}\t{branch}\t{desc}\t{upstream_pr}")
          PY

          {
            echo "## Patches applied"
            echo
            echo "| Status | Name | Branch | Commits | Description |"
            echo "|--------|------|--------|---------|-------------|"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r name branch desc upstream_pr; do
            echo ""
            echo "→ Applying $name ($branch)"

            if ! git fetch origin "$branch" --quiet 2>/dev/null; then
              echo "::error::branch not found in origin: $branch"
              echo "| FAIL | \`$name\` | \`$branch\` | — | branch not found |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            head_sha=$(git rev-parse "origin/$branch")

            base=$(git merge-base HEAD "$head_sha" 2>/dev/null || true)
            if [ -z "$base" ]; then
              echo "::error::no merge base between staging HEAD and origin/$branch"
              exit 1
            fi
            ahead=$(git rev-list --count "$base..$head_sha")

            # Empty branch (already absorbed by upstream) — skip and warn.
            if git diff --quiet "$base" "$head_sha"; then
              echo "  (empty diff vs base — skipping)"
              note="branch absorbed by upstream — drop from manifest"
              if [ -n "$upstream_pr" ]; then
                note="$note (see $upstream_pr)"
              fi
              echo "::warning::$name: $note"
              echo "| WARN | \`$name\` | \`$branch\` | 0 | $note |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if ! git merge --no-ff -m "Merge '$branch' into personal/main

          $desc" "origin/$branch"; then
              echo "::error::merge of $branch failed"
              echo "| CONFLICT | \`$name\` | \`$branch\` | $ahead | merge conflict |" >> "$GITHUB_STEP_SUMMARY"
              git merge --abort 2>/dev/null || true
              exit 1
            fi

            echo "| OK | \`$name\` | \`$branch\` | $ahead | $desc |" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/patches.tsv

          new_sha=$(git rev-parse personal-main-staging)
          old_sha=$(git rev-parse origin/personal/main 2>/dev/null || echo "")
          {
            echo ""
            echo "## Result"
            echo ""
            echo "- Old head: \`$old_sha\`"
            echo "- New head: \`$new_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$new_sha" = "$old_sha" ]; then
            echo "- No change." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push rebuilt branch
        if: ${{ inputs.dry_run != true }}
        run: |
          git push --force-with-lease origin personal-main-staging:personal/main

  build:
    name: Build and publish gc binaries
    needs: rebuild
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal/main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          TAG="personal-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          LDFLAGS="-s -w -X main.version=${TAG} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              echo "Building gc-${GOOS}-${GOARCH}..."
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags "$LDFLAGS" \
                -o "dist/gc-${GOOS}-${GOARCH}" \
                ./cmd/gc/
            done
          done

          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum gc-* > checksums.txt
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gc-binaries-${{ env.TAG }}
          path: dist/
          retention-days: 30

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete personal-latest --yes 2>/dev/null || true
          git tag -f personal-latest
          git push origin personal-latest --force
          gh release create personal-latest dist/* \
            --title "personal-latest (rolling)" \
            --notes "Rolling build from \`personal/main\` — built from commit \`$(git rev-parse --short HEAD)\` on $(date -u +%Y-%m-%d).

          ## Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/dstengle/gascity/personal/main/scripts/install.sh | sh
          \`\`\`" \
            --prerelease

      - name: Notify devcontainer to rebuild
        env:
          GH_TOKEN: ${{ secrets.DEVCONTAINER_DISPATCH_TOKEN }}
        run: |
          gh api repos/dstengle/devcontainer-python-node-claude/dispatches \
            -f event_type=gascity-personal-build-completed \
            -F "client_payload[gascity_sha]=$(git rev-parse HEAD)" \
            -F "client_payload[gascity_tag]=${TAG}"
