name: Sync personal/main from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # daily at 6am UTC

permissions:
  contents: write

jobs:
  sync:
    name: Rebase personal/main onto upstream/main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal/main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase onto upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/gastownhall/gascity.git
          git fetch upstream main
          git rebase upstream/main

      - name: Push rebased branch
        run: git push --force-with-lease origin personal/main
