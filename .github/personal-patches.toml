# Source of truth for what's applied on top of upstream/main when
# personal/main is rebuilt by personal-sync.yml. Each [[patches]] entry
# becomes a single merge commit on personal/main; the merge brings in the
# entire patch branch.
#
# Editing this file:
#   - Add a patch:    create a feature branch in this fork off upstream/main,
#                     push it, then add a [[patches]] entry pointing at it.
#   - Drop a patch:   remove the entry. Next sync run rebuilds without it.
#   - Reorder:        rearrange entries. Order is the merge order.
#
# Field reference:
#   name           Required. Stable identifier used in logs and step summaries.
#   branch         Required. Branch name in dstengle/gascity (no "origin/" prefix).
#   description    Required. One-liner included in the merge commit message.
#   upstream_pr    Optional. URL of the upstream PR this corresponds to.
#                  When upstream merges that PR, sync detects the empty diff
#                  and prints a "ready to drop" warning in the run summary.
#
# Manual dry run from your machine:
#   gh workflow run personal-sync.yml -f dry_run=true
#   gh run watch <run-id>

[[patches]]
name = "personal-build-infrastructure"
branch = "chore/personal-build-infrastructure"
description = "personal-build + sync workflows, rolling release, install script, devcontainer dispatch"

[[patches]]
name = "issue-1295-init-steps"
branch = "fix/issue-1295-init-steps"
description = "ensure beads.role, issue_prefix, and custom types on gc init/start"
upstream_pr = "https://github.com/gastownhall/gascity/pull/1295"

[[patches]]
name = "bd-init-fall-through"
branch = "fix/bd-init-fall-through"
description = "fall through to bd init when fast-path schema absent on registered DB"
upstream_pr = "https://github.com/gastownhall/gascity/pull/1477"

[[patches]]
name = "gc-init-issue-prefix"
branch = "fix/gc-init-issue-prefix"
description = "ensure gc init writes issue_prefix into the beads database"

[[patches]]
name = "bd-init-schema-probe"
branch = "fix/bd-init-schema-probe"
description = "probe schema before bd init in op_init fall-throughs"
