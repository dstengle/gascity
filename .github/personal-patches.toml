# Source of truth for what's applied on top of upstream/main when
# personal/main is rebuilt by personal-sync.yml. Each [[patches]] entry
# becomes a single merge commit on personal/main; the merge brings in the
# entire patch branch.
#
# Editing this file:
#   - Add a patch:    create a feature branch in this fork off upstream/main,
#                     push it, then add a [[patches]] entry pointing at it.
#   - Drop a patch:   remove the entry. Next sync run rebuilds without it.
#   - Reorder:        rearrange entries. Order is the merge order.
#
# Field reference:
#   name           Required. Stable identifier used in logs and step summaries.
#   branch         Required. Branch name in dstengle/gascity (no "origin/" prefix).
#   description    Required. One-liner included in the merge commit message.
#   upstream_pr    Optional. URL of the upstream PR this corresponds to.
#                  When upstream merges that PR, sync detects the empty diff
#                  and prints a "ready to drop" warning in the run summary.
#
# Manual dry run from your machine:
#   gh workflow run personal-sync.yml -f dry_run=true
#   gh run watch <run-id>

# No patches currently applied — personal/main = upstream/main.
